[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-workflow"
version = "0.1.0"
description = "Resumable, evidence-driven orchestration for production web application delivery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
ai = "ai_workflow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workflow"]

[tool.pytest.ini_options]
pythonpath = ["src", "../base_ai/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
